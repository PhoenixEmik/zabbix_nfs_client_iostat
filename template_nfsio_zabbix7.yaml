zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: 408d615ff22d40f4a2572cc011f8903d
    template: Template NFS IO Stats
    name: Template NFS IO Stats
    description: NFS client statistics from nfsiostat. Modern templates collect all metrics once per mount and use dependent
      items.
    vendor:
      name: CPOS-HPC
      version: 1.5.0
    groups:
    - name: Templates
    discovery_rules:
    - uuid: 0000266c4f934139a9c0e96c9068a40e
      name: NFS mount point discovery
      key: nfsio.discovery
      delay: 2m
      lifetime: 1d
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers mounted NFS and NFSv4 filesystems.
      item_prototypes:
      - uuid: 6a1e4fcf9e4a4bb9a7de28c884f41101
        name: '{#MOUNT_POINT}: Get NFS client statistics'
        key: nfsio.get["{#MOUNT_POINT}"]
        delay: 1m
        history: '0'
        trends: '0'
        value_type: TEXT
        description: Raw JSON returned by one nfsiostat sample. Used by dependent item prototypes.
        tags:
        - tag: Application
          value: NFS raw
      - uuid: 2ebc7f237cfa40d1bcfb2d4cebecff2d
        name: '{#MOUNT_POINT}: RPC backlog'
        type: DEPENDENT
        key: nfsio["{#MOUNT_POINT}",bklog]
        delay: '0'
        history: 30d
        value_type: FLOAT
        description: Average length of the RPC backlog queue.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.bklog
        master_item:
          key: nfsio.get["{#MOUNT_POINT}"]
        tags:
        - tag: Application
          value: NFS
      - uuid: 2649c5720097410192c860a3cfbf9bf6
        name: '{#MOUNT_POINT}: Operations'
        type: DEPENDENT
        key: nfsio["{#MOUNT_POINT}",op_s]
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: ops/s
        description: Total NFS RPC operations per second.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.op_s
        master_item:
          key: nfsio.get["{#MOUNT_POINT}"]
        tags:
        - tag: Application
          value: NFS
      - uuid: 0f805a66c2a04e48a8acf1368bf111e5
        name: '{#MOUNT_POINT}: Read errors'
        type: DEPENDENT
        key: nfsio["{#MOUNT_POINT}",read_error]
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: errors
        description: Read operations completed with an error during the sample interval. Available with RPC iostats version
          1.1 or newer.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.read_error
          error_handler: DISCARD_VALUE
        master_item:
          key: nfsio.get["{#MOUNT_POINT}"]
        tags:
        - tag: Application
          value: NFS
      - uuid: 75119e1dbb4543baa443cba2cb2eaa02
        name: '{#MOUNT_POINT}: Read error rate'
        type: DEPENDENT
        key: nfsio["{#MOUNT_POINT}",read_error_perc]
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: '%'
        description: Percentage of read operations completed with an error. Available with RPC iostats version 1.1 or newer.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.read_error_perc
          error_handler: DISCARD_VALUE
        master_item:
          key: nfsio.get["{#MOUNT_POINT}"]
        tags:
        - tag: Application
          value: NFS
      - uuid: dbcc2244995246bf9b7aef96ddaf452d
        name: '{#MOUNT_POINT}: Read execution time'
        type: DEPENDENT
        key: nfsio["{#MOUNT_POINT}",read_exe]
        delay: '0'
        history: 30d
        value_type: FLOAT
